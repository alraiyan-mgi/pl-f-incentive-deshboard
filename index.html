<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PL-F (CSD) ইনসেনটিভ ড্যাশবোর্ড – নভেম্বর ২০২৬</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef4f4;--card:#fff;--ink:#14232b;--mut:#62737c;--line:#dbe5e8;--acc:#0b7a75;--accd:#00504d;--accbg:#dff1ef;--warm:#c8791a;--bad:#b3402f;--badbg:#f8e3df;--e1:0 1px 2px rgba(0,40,40,.08),0 1px 3px 1px rgba(0,40,40,.06);--e2:0 2px 6px 2px rgba(0,40,40,.10),0 1px 2px rgba(0,40,40,.12);--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 400px at 100% 0,#d4ece9 0,transparent 60%),var(--bg);color:var(--ink);font:15px/1.5 "Hind Siliguri","Roboto",system-ui,sans-serif}
main{max-width:1240px;margin:0 auto;padding:14px 14px 48px}
.ms{font-family:"Material Symbols Rounded";font-weight:400;font-style:normal;font-size:22px;line-height:1;display:inline-block;vertical-align:middle;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-smoothing:antialiased}
#prog{position:fixed;top:0;left:0;right:0;height:4px;z-index:50;opacity:0;transition:opacity .3s;background:linear-gradient(90deg,transparent,#5eead4,transparent) 0 0/40% 100% no-repeat,#b2dfdb;animation:ind 1.1s linear infinite}
@keyframes ind{to{background-position:260% 0,0 0}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes row{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes grow{from{width:0}}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
@keyframes spin{to{transform:rotate(360deg)}}
.hero{position:relative;overflow:hidden;border-radius:28px;color:#fff;padding:22px 28px;margin-bottom:16px;background:radial-gradient(500px 220px at 85% 120%,rgba(255,90,0,.5),transparent 70%),radial-gradient(400px 200px at 5% -20%,rgba(225,29,29,.35),transparent 70%),linear-gradient(120deg,#070707,#17100c 55%,#2b0f06);box-shadow:var(--e2),inset 0 0 0 1px #3a1a0c;animation:up .7s var(--ease) both}
.hero::before{content:"";position:absolute;left:-10%;right:-10%;bottom:-60%;height:90%;background:radial-gradient(ellipse at 50% 100%,rgba(255,140,0,.55),rgba(255,60,0,.25) 40%,transparent 70%);animation:fire 3s ease-in-out infinite alternate}
@keyframes fire{from{opacity:.55;transform:scaleY(.9)}to{opacity:1;transform:scaleY(1.15) translateY(-6px)}}
.hero-in{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.hero h1{font-size:26px;margin:0 0 2px;font-weight:700;text-shadow:0 0 18px rgba(255,106,0,.7)}
.hero .sub{margin:0;color:#ffcf9f;font-size:13.5px}
@keyframes bob{50%{transform:translateY(-5px)}}
.logo{position:relative;z-index:2;animation:bob 4s ease-in-out infinite}
.logo img{height:124px;display:block;filter:drop-shadow(0 6px 14px rgba(0,0,0,.6)) drop-shadow(0 0 16px rgba(255,120,0,.45))}
.bolt{position:absolute;z-index:1;pointer-events:none;opacity:0;filter:drop-shadow(0 0 6px #ffb300) drop-shadow(0 0 16px #ff6a00);animation:zap var(--d) infinite;animation-delay:var(--l)}
@keyframes zap{0%,100%{opacity:0}3%{opacity:1}5%{opacity:.15}7%{opacity:1}12%{opacity:.5}16%{opacity:0}}
.arc{position:absolute;left:0;top:20%;width:100%;height:60%;z-index:1;pointer-events:none;fill:none;stroke:#ffd36a;stroke-width:2;stroke-linejoin:bevel;filter:drop-shadow(0 0 5px #ff9a1f);stroke-dasharray:1400;stroke-dashoffset:1400;opacity:0;animation:arc 4.4s linear infinite}
.arc.a2{top:35%;animation-duration:5.6s;animation-delay:-2s}
@keyframes arc{0%{stroke-dashoffset:1400;opacity:0}4%{opacity:1}10%{stroke-dashoffset:0;opacity:1}14%{opacity:.2}18%{opacity:1}24%,100%{stroke-dashoffset:0;opacity:0}}
.flash{position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(circle at 60% 40%,rgba(255,200,90,.55),rgba(255,90,0,.2) 45%,transparent 70%);opacity:0;animation:zap 3.3s infinite}
.hero #rf{display:inline-flex;align-items:center;gap:6px;margin-top:12px;border:0;border-radius:20px;padding:8px 18px;font-weight:600;color:#fff;cursor:pointer;background:linear-gradient(135deg,#ff8a00,#e63b00);box-shadow:0 0 14px rgba(255,106,0,.55);transition:transform .2s,box-shadow .2s}
.hero #rf:hover{transform:translateY(-2px);box-shadow:0 0 24px rgba(255,140,0,.9)}
.loader{background:var(--card);border-radius:20px;padding:34px 20px;box-shadow:var(--e1);display:flex;flex-direction:column;align-items:center;gap:14px;animation:pop .4s both}
.spin{width:54px;height:54px;border-radius:50%;border:5px solid #ffe3cc;border-top-color:#ff6a00;border-right-color:var(--acc);animation:spin .9s linear infinite}
.dots{display:flex;gap:6px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--acc);animation:bnc 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bnc{0%,80%,100%{transform:none;opacity:.4}40%{transform:translateY(-9px);opacity:1}}
.sk{height:96px;border-radius:20px;background:linear-gradient(90deg,#e4edee 25%,#f4f8f8 50%,#e4edee 75%) 0 0/200% 100%;animation:shim 1.2s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
.fail{display:flex;align-items:center;gap:10px;font-size:16px}
.sub{color:var(--mut);font-size:13px;margin:0}
.up{display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:var(--card);border-radius:16px;padding:10px 14px;margin-bottom:16px;box-shadow:var(--e1);animation:up .6s .1s var(--ease) both}
.up label{font-size:13px;color:var(--mut);font-weight:600;display:flex;align-items:center;gap:8px;margin-right:auto}
.up #um{width:100%;margin:0}
button{position:relative;overflow:hidden;font:inherit}
.up button{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--accbg);color:var(--accd);border-radius:20px;padding:8px 18px;font-weight:600;cursor:pointer;transition:box-shadow .2s,transform .2s}
.up button:hover{box-shadow:var(--e1);transform:translateY(-1px)}
#rf.ld .ms{animation:spin .8s linear infinite}
select{font:inherit;background:var(--card);color:var(--ink);border:1px solid #9bb0b6;border-radius:10px;padding:8px 10px;max-width:100%;cursor:pointer;transition:border-color .2s,box-shadow .2s}
select:hover,select:focus{border-color:var(--acc);box-shadow:0 0 0 2px var(--accbg);outline:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.k{position:relative;overflow:hidden;background:var(--card);border-radius:20px;padding:14px 16px;box-shadow:var(--e1);transition:transform .25s var(--ease),box-shadow .25s;animation:pop .6s var(--ease) both;animation-delay:calc(var(--i)*70ms)}
.k:hover{transform:translateY(-4px);box-shadow:var(--e2)}
.k .ms{background:var(--accbg);color:var(--acc);border-radius:12px;padding:8px;margin-bottom:8px;transition:transform .4s var(--ease)}
.k:hover .ms{transform:rotate(-12deg) scale(1.1)}
.k b{display:block;font-size:20px;font-weight:700;font-family:"Roboto","Hind Siliguri",sans-serif;word-break:break-word}
.k span{color:var(--mut);font-size:12.5px}
.k.hi{background:linear-gradient(135deg,#e6f6f3,#cfeee9)}.k.hi .ms{background:var(--acc);color:#fff}
.rank-sec{background:var(--card);border-radius:20px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--e1);display:none;animation:up .6s .2s var(--ease) both}
.rank-sec h3{margin:0 0 14px;font-size:16px;color:var(--ink);display:flex;justify-content:space-between;align-items:center}
.rank-bars{display:flex;flex-direction:column;gap:9px}
.rank-row{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;animation:row .5s var(--ease) both;animation-delay:calc(var(--i)*80ms)}
.r-name{width:120px;text-align:right;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-bar-wrap{flex:1;background:#e8eff1;border-radius:12px;height:24px;overflow:hidden}
.r-bar{position:relative;height:100%;border-radius:12px;overflow:hidden;animation:grow 1.1s var(--ease) both;animation-delay:calc(var(--i)*80ms + .2s)}
.r-bar::after{content:"";position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:shine 2.2s 1.4s ease-in-out infinite}
.r-val{width:100px;font-family:"Roboto",monospace;font-size:12.5px}
.rank-badge{width:26px;height:26px;border-radius:50%;display:flex;justify-content:center;align-items:center;font-size:12px;box-shadow:var(--e1)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{display:inline-flex;align-items:center;gap:6px;border:1px solid #9bb0b6;background:var(--card);color:var(--mut);font-weight:600;padding:8px 16px;border-radius:10px;cursor:pointer;transition:all .25s var(--ease)}
.tabs button .ms{font-size:18px}.tabs button:hover{background:var(--accbg)}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:var(--e1);transform:translateY(-1px)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
#out{animation:up .5s var(--ease) both}
.tw{overflow-x:auto;background:var(--card);border-radius:20px;margin-bottom:20px;box-shadow:var(--e1)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:#e9f2f1;color:var(--accd);font-weight:700}
th:first-child,td:first-child,th.l,td.l{text-align:left}
.tw tr{animation:row .45s var(--ease) both}
tr:hover td{background:var(--accbg)}
.m{font-weight:700;color:var(--acc)}
.medal{display:inline-block;min-width:34px;text-align:center;border-radius:12px;padding:0 8px;color:#fff!important}
.m1{background:linear-gradient(135deg,#f6c945,#d49a00)}.m2{background:linear-gradient(135deg,#b8c4cc,#8a99a3)}.m3{background:linear-gradient(135deg,#d99a63,#a9622c)}
.note{background:var(--card);border-left:5px solid var(--warm);border-radius:16px;padding:12px 16px;margin-bottom:12px;font-size:14px;box-shadow:var(--e1);animation:up .5s var(--ease) both}
.note ul{margin:6px 0 0;padding-left:18px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:10px;margin-bottom:12px}
.two h3{margin:0 0 8px;font-size:14px}
.tot{font-weight:700;background:#e9f2f1}
.slab-row{cursor:pointer;transition:background .2s}
.sel-slab td{background:var(--accbg)!important;font-weight:600;color:var(--acc);border-bottom:2px solid var(--acc)}
.clr-btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;background:var(--badbg);color:var(--bad);padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:10px;animation:pop .3s both}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.25;transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(2.4);opacity:0}}
.er{color:var(--bad)!important}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
@media(max-width:600px){.logo img{height:86px}.hero h1{font-size:20px}.r-name{width:80px}.r-val{width:78px}}
</style>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
const fm = n => Math.round(n).toLocaleString('en-IN');
const sum = (a, k) => a.reduce((x, s) => x + s[k], 0);
const cl = s => s.replace(/\(F\)/g, '').replace(/_/g, ' ').replace(/\s[WRT]$/, '').replace(/\s+/g, ' ').trim();

let SR = [], TM = [], RM = [], WM = [], LW = 0, D = {rows: []};
const st = { tab: 'sr', w: '', r: '', t: '', sort: 'val', wk: 0, slab: null };
const TABS = [['sr', 'SR'], ['tm', 'TM'], ['rm', 'RM'], ['wm', 'WM'], ['x', 'নিয়ম ও নির্দেশিকা']];

// Auto Load Script on Page Load
document.addEventListener('DOMContentLoaded', () => {
    autoLoadExcel();
});

const msg = (t, e) => { const m = $('#um'); m.textContent = t; m.className = 'sub' + (e ? ' er' : ''); };

function autoLoadExcel() {
  msg('Google Sheet theke data load hocche...', false); ld(1); showLoader();
  
  // Apnar Google Sheet er ID
  const sheetId = '1hS3axsWKqCHClFAs21SkUxxQG4V2_DhLG5tcUqpZx5k';
  // Google Sheet theke direct CSV format e data pawar API link
  const sheetUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv`;
  
  // Cache thekanor jonno timestamp add kora hoyeche
  fetch(sheetUrl + '&t=' + new Date().getTime())
    .then(res => {
      if(!res.ok) throw new Error('Sheet er data paoya jacche na');
      return res.arrayBuffer();
    })
    .then(ab => {
      const wb = XLSX.read(ab, { type: 'array' });
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' });
      loadSales(rows, "Google Sheet"); ld(0); if ($('.loader')) fail();
    })
    .catch(err => { ld(0); fail(); });
}

function toDay(v) {
  if (typeof v == 'number' && v > 20000) return new Date(Math.round((v - 25569) * 864e5)).getUTCDate();
  if (v instanceof Date) return v.getDate();
  const m = String(v).match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return +m[3];
  const n = String(v).match(/(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);
  return n ? +n[1] : 1;
}

function loadSales(rows, fileName) {
  const h = (rows[0] || []).map(String).map(x => x.trim());
  
  const c = [
    /date/i,             
    /wing/i,             
    /region/i,           
    /territor/i,         
    /code|sap|id/i,      
    /name/i,             
    /volume/i,           
    /value/i             
  ].map(re => h.findIndex(x => re.test(x)));
  
  if ([1, 2, 3, 5, 6, 7].some(i => c[i] < 0)) return msg('দরকারি কলাম পাওয়া যায়নি। (Wing, Region, Territory, Employee Name, Volume, Value)', 1);
  
  const out = rows.slice(1).filter(r => String(r[c[1]]).trim() && String(r[c[5]]).trim()).map(r => [
    c[0] < 0 ? 1 : toDay(r[c[0]]), 
    ...[1, 2, 3].map(i => String(r[c[i]]).trim()), 
    c[4] < 0 ? '' : String(r[c[4]]).trim(), 
    String(r[c[5]]).trim(), 
    +r[c[6]] || 0, 
    +r[c[7]] || 0
  ]);
  
  if (!out.length) {
      msg('ফাইলে কোনো ডেটা সারি নেই', 1);
      return;
  }
  
  D.rows = out; st.anim = 1;
  initData(D);
  st.w = st.r = st.t = ''; st.slab = null;
  draw();
  msg(`সাকসেসফুলি অটো-লোড হয়েছে: ${out.length} টি এন্ট্রি। (শেষ আপডেট: ${new Date().toLocaleTimeString()})`, false);
}

function initData(data) {
  const S = new Map(); 
  LW = 0;
  
  data.rows.forEach(x => {
    const [dy, w, rg, t, sap, e, vo, va] = x;
    const wk = Math.min(4, Math.floor((dy - 1) / 7));
    LW = Math.max(LW, wk);
    
    let k = [w, rg, t, e].join('|'), s = S.get(k);
    if (!s) S.set(k, s = { w, r: rg, t, e, sap, vol: 0, val: 0, wv: [0, 0, 0, 0, 0] });
    
    s.vol += vo; 
    s.val += va; 
    s.wv[wk] += va;
  });
  
  calc(S);
}

function calc(S) {
  SR = [...S.values()].map(s => ({
    ...s,
    i: st.wk ? s.wv.reduce((x, v) => x + Math.floor(v / 1e5) * 600, 0) : Math.floor(s.val / 1e5) * 600
  }));

  const tmMap = new Map();
  SR.forEach(s => {
    let k = s.w + '|' + s.r + '|' + s.t;
    if (!tmMap.has(k)) tmMap.set(k, { w: s.w, r: s.r, t: s.t, val: 0, vol: 0, src: 0 });
    let tm = tmMap.get(k); tm.val += s.val; tm.vol += s.vol; tm.src += 1;
  });
  TM = [...tmMap.values()].map(t => ({ ...t, i: Math.floor(t.val / 6e5) * 1000 }));

  const rmMap = new Map();
  TM.forEach(t => {
    let k = t.w + '|' + t.r;
    if (!rmMap.has(k)) rmMap.set(k, { w: t.w, r: t.r, val: 0, vol: 0 });
    let rm = rmMap.get(k); rm.val += t.val; rm.vol += t.vol;
  });
  RM = [...rmMap.values()].map(r => ({ ...r, i: Math.floor(r.val / 2.5e6) * 2000 }));

  const wmMap = new Map();
  RM.forEach(r => {
    let k = r.w;
    if (!wmMap.has(k)) wmMap.set(k, { w: r.w, val: 0, vol: 0 });
    let wm = wmMap.get(k); wm.val += r.val; wm.vol += r.vol;
  });
  WM = [...wmMap.values()].map(w => ({ ...w, i: Math.floor(w.val / 6e6) * 5000 }));

  SR.sort((a,b) => b.val - a.val).forEach((s,i) => s.rank = i+1);
  TM.sort((a,b) => b.val - a.val).forEach((t,i) => t.rank = i+1);
  RM.sort((a,b) => b.val - a.val).forEach((r,i) => r.rank = i+1);
  WM.sort((a,b) => b.val - a.val).forEach((w,i) => w.rank = i+1);
}

function kpis() {
  const all = sum(SR, 'i') + sum(TM, 'i') + sum(RM, 'i') + sum(WM, 'i');
  const srCount = SR.filter(s => s.i > 0).length, tmCount = TM.filter(t => t.i > 0).length, rmCount = RM.filter(r => r.i > 0).length, wmCount = WM.filter(w => w.i > 0).length;

  const totVal = sum(SR, 'val');
  const commPct = totVal > 0 ? (all / totVal * 100).toFixed(2) : '0.00';

  $('#kpis').innerHTML = [
    ['ডেলিভারি ভ্যালু', '৳' + (sum(SR, 'val') / 1e7).toFixed(2) + ' কোটি'],
    ['ডেলিভারি ভলিউম', fm(sum(SR, 'vol'))],
    ['মোট ফিল্ড ফোর্স', `SR: ${SR.length} | TM: ${TM.length} | RM: ${RM.length} | WM: ${WM.length}`],
    ['ইনসেনটিভ প্রাপ্ত', `SR: ${srCount} | TM: ${tmCount} | RM: ${rmCount} | WM: ${wmCount}`, 1],
    ['সর্বমোট ইনসেনটিভ', '৳' + fm(all), 1],
    ['কমিশন পারসেন্টেজ', commPct + '%', 1]
  ].map((k, i) => `<div class="k${k[2] ? ' hi' : ''}" style="--i:${i}"><i class="ms">${['payments','inventory_2','groups','military_tech','account_balance_wallet','percent'][i]}</i><b>${k[1]}</b><span>${k[0]}</span></div>`).join('');
  document.querySelectorAll('#kpis b').forEach(countUp);
}

function drawWingBars() {
  const rankColors = ["#008744", "#2ea243", "#5cba42", "#8ccd41", "#c5df40", "#f8cd2a", "#f39121", "#d62d20"];
  let html = '';
  const maxVal = Math.max(...WM.map(w => w.val));

  WM.forEach((w) => {
    const widthPct = (w.val / maxVal) * 100;
    const color = rankColors[w.rank - 1] || '#92a4ad';
    html += `<div class="rank-row" style="--i:${w.rank}"><div class="rank-badge" style="background:${color}; color:#fff;">${w.rank}</div><div class="r-name" title="${esc(cl(w.w))}">${esc(cl(w.w))}</div><div class="r-bar-wrap"><div class="r-bar" style="width: ${widthPct}%; background: ${color};"></div></div><div class="r-val">৳ ${fm(w.val)}</div></div>`;
  });
  
  $('#wing-bars').innerHTML = html;
  $('#rank-sec').style.display = 'block';
}

const TI = { sr: 'person', tm: 'pin_drop', rm: 'map', wm: 'public', x: 'menu_book' };
function tabs() {
  $('#tabs').innerHTML = TABS.map(t => `<button class="${st.tab == t[0] ? 'on' : ''}" data-t="${t[0]}"><i class="ms">${TI[t[0]]}</i>${t[1]}</button>`).join('');
}

function fbar() {
  const sel = (id, l, arr, v) => `<select id="${id}"><option value="">All ${l}</option>${arr.map(x => `<option value="${esc(x)}"${x == v ? ' selected' : ''}>${esc(cl(x))}</option>`).join('')}</select>`;
  const u = (k, f) => [...new Set(SR.filter(f).map(s => s[k]))].sort();
  
  let h = '';
  if (st.tab != 'x') {
    h += sel('fw', 'Wing', u('w', () => 1), st.w);
    if (st.tab == 'sr' || st.tab == 'tm' || st.tab == 'rm') h += sel('fr', 'Region', u('r', s => !st.w || s.w == st.w), st.r);
    if (st.tab == 'sr' || st.tab == 'tm') h += sel('ft', 'Territory', u('t', s => (!st.w || s.w == st.w) && (!st.r || s.r == st.r)), st.t);
    h += `<select id="fs"><option value="val"${st.sort == 'val' ? ' selected' : ''}>ভ্যালু (বেশি→কম)</option><option value="i"${st.sort == 'i' ? ' selected' : ''}>ইনসেনটিভ (বেশি→কম)</option></select>`;
  }
  $('#fbar').innerHTML = h;
}

const flt = a => a.filter(s => (!st.w || s.w == st.w) && (!st.r || s.r == st.r) && (!st.t || s.t == st.t)).sort((x, y) => y[st.sort] - x[st.sort]);

function getSlabPanel(S, roleName, slabVal) {
  const cnt = {};
  S.forEach(s => { const n = s.i / slabVal; cnt[n] = (cnt[n] || 0) + 1; });
  const ns = Object.keys(cnt).map(Number).sort((a, b) => a - b);
  const N = S.length || 1;
  return `<div class="two"><div><h3>${roleName}: কে কয়টি স্ল্যাব পেয়েছে (মোট ${S.length} জন)</h3><div class="tw"><table><tr><th>স্ল্যাব</th><th>জন</th><th>%</th><th>মোট (৳)</th></tr>${ns.map(n => `<tr class="slab-row ${st.slab === n ? 'sel-slab' : ''}" data-slab="${n}" title="তালিকা দেখতে ক্লিক করুন"><td>${n ? n + 'টি (৳' + fm(n * slabVal) + ')' : 'কোনো স্ল্যাব নয়'}</td><td>${cnt[n]}</td><td>${(100 * cnt[n] / N).toFixed(1)}\%</td><td>${fm(n * slabVal * cnt[n])}</td></tr>`).join('')}<tr class="tot"><td>মোট</td><td>${S.length}</td><td></td><td>${fm(sum(S, 'i'))}</td></tr></table></div><p class="sub">তালিকা ফিল্টার করতে উপরের যেকোনো স্ল্যাবে ক্লিক করুন।</p></div></div>`;
}

function r_sr() {
  const a = flt(SR);
  const viewData = st.slab !== null ? a.filter(s => s.i / 600 === st.slab) : a;
  $('#out').innerHTML = `<p class="sub">${a.length} জন SR · ফিল্টারকৃত ইনসেনটিভ ৳${fm(sum(a, 'i'))} · স্ল্যাব পেয়েছেন ${a.filter(s => s.i > 0).length} জন</p>${getSlabPanel(a, 'SR', 600)}${st.slab !== null ? `<div class="clr-btn" id="clr-slab">✖ স্ল্যাব ফিল্টার মুছুন (${st.slab} টি স্ল্যাব দেখাচ্ছে)</div>` : ''}<div class="tw"><table><tr><th class="l">National Rank</th><th class="l">SR ID</th><th class="l">SR Name</th><th class="l">Wing</th><th class="l">Region</th><th class="l">Territory</th><th>ভলিউম</th><th>ভ্যালু (৳)</th><th>স্ল্যাব</th><th>ইনসেনটিভ (৳)</th></tr>${viewData.map(s => `<tr><td class="l"><b style="color:var(--acc)">#${s.rank}</b></td><td class="l">${esc(s.sap)}</td><td class="l">${esc(cl(s.e))}</td><td class="l">${esc(cl(s.w))}</td><td class="l">${esc(cl(s.r))}</td><td class="l">${esc(cl(s.t))}</td><td>${fm(s.vol)}</td><td>${fm(s.val)}</td><td>${s.i / 600}</td><td class="m">${fm(s.i)}</td></tr>`).join('')}</table></div>`;
}

function r_tm() {
  const a = flt(TM);
  const viewData = st.slab !== null ? a.filter(s => s.i / 1000 === st.slab) : a;
  $('#out').innerHTML = `<p class="sub">${a.length} টি Territory · ফিল্টারকৃত TM ইনসেনটিভ ৳${fm(sum(a, 'i'))}</p>${getSlabPanel(a, 'TM', 1000)}${st.slab !== null ? `<div class="clr-btn" id="clr-slab">✖ স্ল্যাব ফিল্টার মুছুন (${st.slab} টি স্ল্যাব দেখাচ্ছে)</div>` : ''}<div class="tw"><table><tr><th class="l">National Rank</th><th class="l">Wing</th><th class="l">Region</th><th class="l">Territory</th><th>SR সংখ্যা</th><th>ভলিউম</th><th>ভ্যালু (৳)</th><th>স্ল্যাব</th><th>TM ইনসেনটিভ (৳)</th></tr>${viewData.map(s => `<tr><td class="l"><b style="color:var(--acc)">#${s.rank}</b></td><td class="l">${esc(cl(s.w))}</td><td class="l">${esc(cl(s.r))}</td><td class="l">${esc(cl(s.t))}</td><td>${s.src}</td><td>${fm(s.vol)}</td><td>${fm(s.val)}</td><td>${s.i / 1000}</td><td class="m">${fm(s.i)}</td></tr>`).join('')}</table></div>`;
}

function r_rm() {
  const a = flt(RM);
  const viewData = st.slab !== null ? a.filter(s => s.i / 2000 === st.slab) : a;
  $('#out').innerHTML = `<p class="sub">${a.length} টি Region · ফিল্টারকৃত RM ইনসেনটিভ ৳${fm(sum(a, 'i'))}</p>${getSlabPanel(a, 'RM', 2000)}${st.slab !== null ? `<div class="clr-btn" id="clr-slab">✖ স্ল্যাব ফিল্টার মুছুন (${st.slab} টি স্ল্যাব দেখাচ্ছে)</div>` : ''}<div class="tw"><table><tr><th class="l">National Rank</th><th class="l">Wing</th><th class="l">Region</th><th>ভলিউম</th><th>ভ্যালু (৳)</th><th>স্ল্যাব</th><th>RM ইনসেনটিভ (৳)</th></tr>${viewData.map(s => `<tr><td class="l"><b style="color:var(--acc)">#${s.rank}</b></td><td class="l">${esc(cl(s.w))}</td><td class="l">${esc(cl(s.r))}</td><td>${fm(s.vol)}</td><td>${fm(s.val)}</td><td>${s.i / 2000}</td><td class="m">${fm(s.i)}</td></tr>`).join('')}</table></div>`;
}

function r_wm() {
  const a = flt(WM);
  const viewData = st.slab !== null ? a.filter(s => s.i / 5000 === st.slab) : a;
  $('#out').innerHTML = `<p class="sub">${a.length} টি Wing · ফিল্টারকৃত WM ইনসেনটিভ ৳${fm(sum(a, 'i'))}</p>${getSlabPanel(a, 'WM', 5000)}${st.slab !== null ? `<div class="clr-btn" id="clr-slab">✖ স্ল্যাব ফিল্টার মুছুন (${st.slab} টি স্ল্যাব দেখাচ্ছে)</div>` : ''}<div class="tw"><table><tr><th class="l">National Rank</th><th class="l">Wing</th><th>ভলিউম</th><th>ভ্যালু (৳)</th><th>স্ল্যাব</th><th>WM ইনসেনটিভ (৳)</th></tr>${viewData.map(s => `<tr><td class="l"><b style="color:var(--acc)">#${s.rank}</b></td><td class="l">${esc(cl(s.w))}</td><td>${fm(s.vol)}</td><td>${fm(s.val)}</td><td>${s.i / 5000}</td><td class="m">${fm(s.i)}</td></tr>`).join('')}</table></div>`;
}

function rules() {
  $('#out').innerHTML = `<div class="note"><b>ইনসেনটিভ নিয়ম</b><ul><li>SR: ডেলিভারিকৃত সেকেন্ডারি সেলসে প্রতি পূর্ণ ১ লাখে ৳600</li><li>TM: ডেলিভারিকৃত সেকেন্ডারি সেলসে প্রতি পূর্ণ ৬ লাখে ৳1,000 </li><li>RM: ডেলিভারিকৃত সেকেন্ডারি সেলসে প্রতি পূর্ণ ২৫ লাখে ৳2,000 </li><li>WM: ডেলিভারিকৃত সেকেন্ডারি সেলসে প্রতি পূর্ণ ৬০ লাখে ৳5,000 </li></ul></div><div class="note"><b>প্রোগ্রামের নির্দেশিকা </b><ul>
<li>প্রণোদনা শুধুমাত্র ডেলিভারিকৃত সেকেন্ডারি সেলসের ওপর হিসাব করা হবে।
</li><li>ভ্যালু টার্গেট অর্জনে যেকোনো বেভারেজ (CSD) SKU বিক্রি করা যাবে।
</li><li>অর্জিত স্ল্যাব অনুযায়ী প্রণোদনা প্রদান করা হবে। প্রতিটি স্ল্যাব অর্জনের জন্য ফিল্ড ফোর্স উপরে উল্লিখিত সংশ্লিষ্ট প্রণোদনা পাবেন।
</li><li>বিক্রয় ও ডেলিভারি যাচাইয়ের পর প্রতি সপ্তাহে প্রণোদনা প্রদান করা হবে।
</li><li>বাতিল, ফেরত, বিতর্কিত বা কারসাজিকৃত বিক্রয় প্রণোদনার জন্য যোগ্য বিবেচিত হবে না।
</li><li>চূড়ান্ত অনুমোদনের আগে বিক্রয় ও ডেলিভারি তথ্য যাচাইয়ের অধিকার ম্যানেজমেন্ট সংরক্ষণ করে।
</li><li>SR-এর প্রণোদনা সাপ্তাহিক ভিত্তিতে হিসাব করা হবে এবং যারা নির্ধারিত স্ল্যাব অর্জন করবেন, তাদের প্রতি সপ্তাহে তা প্রদান করা হবে।
</li><li>নীতিমালা লঙ্ঘন বা বিক্রয়ে কারসাজি করলে প্রণোদনা বাতিল হতে পারে।
</li></ul></div>`;
}

function draw() {
  if (!SR.length && st.tab != 'x') {
    $('#rank-sec').style.display = 'none';
  } else if(SR.length > 0) {
    tabs(); fbar(); if (st.anim || !$('#kpis').children.length) { kpis(); drawWingBars(); } st.anim = 0;
    ({ sr: r_sr, tm: r_tm, rm: r_rm, wm: r_wm, x: rules })[st.tab]();
  } else {
     tabs(); ({ x: rules })[st.tab]();
  }
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-t]');
  if (t) { st.tab = t.dataset.t; st.slab = null; draw(); }
  
  const sr = e.target.closest('.slab-row');
  if (sr) {
    const val = Number(sr.dataset.slab);
    st.slab = st.slab === val ? null : val;
    if (st.tab != 'x') ({ sr: r_sr, tm: r_tm, rm: r_rm, wm: r_wm })[st.tab]();
  }

  if (e.target.id === 'clr-slab') {
    st.slab = null;
    if (st.tab != 'x') ({ sr: r_sr, tm: r_tm, rm: r_rm, wm: r_wm })[st.tab]();
  }

  if (e.target.id == 'rf') {
    autoLoadExcel();
  }
});

document.addEventListener('change', e => {
  const t = e.target, m = { fw: 'w', fr: 'r', ft: 't', fs: 'sort' };
  if (m[t.id]) {
    st[m[t.id]] = t.value;
    if (t.id == 'fw') { st.r = ''; st.t = ''; }
    if (t.id == 'fr') st.t = '';
    st.slab = null; 
    fbar();
    if (st.tab != 'x') ({ sr: r_sr, tm: r_tm, rm: r_rm, wm: r_wm })[st.tab]();
  }
  if (t.id == 'wk') { 
    st.wk = +t.value; st.slab = null; 
    if (D.rows.length > 0) { initData(D); st.anim = 1; draw(); } 
  }
});

const ld = on => { $('#prog').style.opacity = on ? 1 : 0; $('#rf').classList.toggle('ld', !!on); };
function countUp(el) {
  const t = el.textContent, re = /\d[\d,]*\.?\d*/g, ms = [...t.matchAll(re)];
  if (!ms.length) return;
  const parts = t.split(re), vals = ms.map(m => ({ v: +m[0].replace(/,/g, ''), d: (m[0].split('.')[1] || '').length }));
  const t0 = performance.now();
  (function f(n) {
    const p = Math.min(1, (n - t0) / 1000), e = 1 - Math.pow(1 - p, 3);
    el.textContent = parts.reduce((s, x, i) => s + x + (i < vals.length ? (vals[i].v * e).toLocaleString('en-IN', { minimumFractionDigits: vals[i].d, maximumFractionDigits: vals[i].d }) : ''), '');
    if (p < 1) requestAnimationFrame(f);
  })(t0);
}
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('button,.k,.clr-btn'); if (!b) return;
  const r = b.getBoundingClientRect(), d = Math.max(r.width, r.height), s = document.createElement('span');
  s.className = 'rip'; s.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX - r.left - d / 2}px;top:${e.clientY - r.top - d / 2}px`;
  b.appendChild(s); setTimeout(() => s.remove(), 600);
});
new MutationObserver(() => {
  document.querySelectorAll('#out .tw tr').forEach((tr, i) => { tr.style.animationDelay = Math.min(i, 24) * 22 + 'ms'; });
  document.querySelectorAll('#out td.l b').forEach(b => { const m = /^#([123])$/.exec(b.textContent); if (m) b.className = 'medal m' + m[1]; });
}).observe($('#out'), { childList: true });

function showLoader() {
  $('#rank-sec').style.display = 'none';
  $('#kpis').innerHTML = '<div class="sk"></div>'.repeat(6);
  $('#out').innerHTML = '<div class="loader"><div class="spin"></div><div class="dots"><i></i><i></i><i></i></div><b>ডেটা লোড হচ্ছে…</b></div>';
}
function fail() {
  msg('', false); $('#kpis').innerHTML = ''; $('#rank-sec').style.display = 'none';
  $('#out').innerHTML = '<div class="note er fail"><i class="ms">error</i><b>Loading failed</b></div>';
}
</script>
